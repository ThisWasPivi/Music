<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Pivəəkly: Pivi's playlist series, with stats and a release timeline."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="theme-color"
      content="#08070d"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#eceef5"
      media="(prefers-color-scheme: light)"
    />
    <title>Pivəəkly · music.pivi.dev</title>
    <script>
      /* Apply the saved theme before the first paint, so there is no flash of the other one. */
      try {
        const theme = localStorage.getItem("pivi-theme");
        if (theme === "light" || theme === "dark")
          document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <style>
      /* Splash shown until the app mounts: a spinning record on the page colour. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #eceef5;
        transition: opacity 400ms ease;
      }
      :root[data-theme="dark"] #splash {
        background: #08070d;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) #splash {
          background: #08070d;
        }
      }
      #splash.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        inline-size: 72px;
        block-size: 72px;
        animation: splash-spin 1.4s linear infinite;
        filter: drop-shadow(0 0 24px rgb(124 58 237 / 0.55));
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <defs>
          <linearGradient id="splash-label" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#a78bfa" />
            <stop offset="0.5" stop-color="#22d3ee" />
            <stop offset="1" stop-color="#f472b6" />
          </linearGradient>
        </defs>
        <circle
          cx="50"
          cy="50"
          r="46"
          fill="#14122b"
          stroke="#a78bfa"
          stroke-width="2"
        />
        <circle
          cx="50"
          cy="50"
          r="36"
          fill="none"
          stroke="#ffffff"
          stroke-opacity=".14"
          stroke-width="1.5"
        />
        <circle
          cx="50"
          cy="50"
          r="28"
          fill="none"
          stroke="#ffffff"
          stroke-opacity=".14"
          stroke-width="1.5"
        />
        <path
          d="M18 34 A36 36 0 0 1 44 15"
          fill="none"
          stroke="#ffffff"
          stroke-opacity=".4"
          stroke-width="3"
          stroke-linecap="round"
        />
        <circle cx="50" cy="50" r="15" fill="url(#splash-label)" />
        <circle cx="50" cy="50" r="3.5" fill="#14122b" />
      </svg>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
