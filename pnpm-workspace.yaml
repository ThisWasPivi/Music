packages:
  - "music"
  - "shared"
  - "sync"

# Refuse freshly published releases for a week: most malicious publishes are
# caught and yanked within days.
minimumReleaseAge: 10080

blockExoticSubdeps: true
trustPolicy: no-downgrade

onlyBuiltDependencies:
  - esbuild
  - sharp

# Audit exceptions. Each one needs a reason and is removed as soon as the
# parents (eslint, @vue/test-utils > js-beautify) accept the fixed majors.
# Both are dev-only tooling: neither package reaches the published site.
auditConfig:
  ignoreGhsas:
    # minimatch < 11.0.1, via eslint: ReDoS on crafted globs; eslint only
    # reads the repository's own config.
    - GHSA-g3hv-75wg-m249
    # glob 9–14.0.1, via @vue/test-utils > js-beautify: AbortSignal bypass;
    # only used by the unit tests.
    - GHSA-3g3m-2fjr-6pw4
